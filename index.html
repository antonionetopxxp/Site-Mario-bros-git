<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sul Goiás Sul</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h1>Notícias Sul Goiás</h1>
        <nav>
            <a href="#noticias">Notícias</a>
            <a href="#eventos">Eventos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>
    
    <main>
        <section id="noticias">
            <h2>Últimas Notícias</h2>
            <div class="noticias-grid" id="noticias-container">
                <!-- Conteúdo será preenchido pelo JavaScript -->
            </div>
        </section>
        
        <section id="eventos">
            <h2>Próximos Eventos</h2>
            <div class="eventos-grid" id="eventos-container">
                <!-- Conteúdo será preenchido pelo JavaScript -->
            </div>
        </section>
        
        <section id="contato">
            <h2>Entre em Contato</h2>
            <form id="formulario-contato">
                <input type="text" placeholder="Nome" required>
                <input type="email" placeholder="Email" required>
                <textarea placeholder="Mensagem" required></textarea>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2023 Sul Goiás Sul. Todos os direitos reservados.</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
