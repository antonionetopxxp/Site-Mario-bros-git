<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sul Goiás Sul</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <div class="container">
            <h1>Notícias Sul Goiás</h1>
            <nav>
                <a href="#noticias">Notícias</a>
                <a href="#eventos">Eventos</a>
                <a href="#contato">Contato</a>
            </nav>
        </div>
    </header>
    
    <main>
        <section id="noticias" class="container">
            <h2>Últimas Notícias</h2>
            <div class="noticias-grid" id="noticias-container">
                <!-- Conteúdo será preenchido pelo JavaScript -->
            </div>
        </section>
        
        <section id="eventos" class="container">
            <h2>Próximos Eventos</h2>
            <div class="eventos-grid" id="eventos-container">
                <!-- Conteúdo será preenchido pelo JavaScript -->
            </div>
        </section>
        
        <section id="contato" class="container">
            <h2>Entre em Contato</h2>
            <form id="formulario-contato">
                <div class="form-group">
                    <input type="text" placeholder="Nome" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <textarea placeholder="Mensagem" required></textarea>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <p>&copy; 2023 Sul Goiás Sul. Todos os direitos reservados.</p>
        </div>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
