<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Online | Profissional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #a38d74; 
            --accent: #27ae60;
            --bg: #f8f9fa;
            --text: #333;
            --radius: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        header {
            background: #fff;
            padding: 10px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        /* GRID RESPONSIVO: 2 colunas no celular, 3 ou 4 no PC */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas no mobile */
            gap: 12px;
        }

        @media (min-width: 768px) {
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* IMAGEM CONTROLADA */
        .product-image {
            width: 100%;
            height: 140px; /* Altura reduzida para não ocupar a tela toda */
            object-fit: cover;
            border-bottom: 1px solid #f0f0f0;
        }

        .product-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .product-info h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            height: 35px; /* Trava altura do título */
            overflow: hidden;
        }

        .price {
            font-weight: bold;
            color: var(--text);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .btn-buy {
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        footer { text-align: center; padding: 20px; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h2 style="color: var(--primary); font-size: 1.2rem;">Minha Vitrine</h2>
        </div>
    </header>

    <main class="container">
        <div class="shop-grid">
            
            <div class="product-card">
                <img src="nutri.webp" alt="Guiar Nutri" class="product-image">
                <div class="product-info">
                    <h3>Guiar Nutri</h3>
                    <div class="price">R$ 297,00</div>
                    <a href="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5" class="btn-buy">Comprar</a>
                </div>
            </div>

            <div class="product-card">
                <img src="Canva.webp" alt="Curso Canva" class="product-image">
                <div class="product-info">
                    <h3>Business Canvas</h3>
                    <div class="price">R$ 27,00</div>
                    <a href="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5" class="btn-buy">Comprar</a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Novo Produto" class="product-image">
                <div class="product-info">
                    <h3>Novo Produto</h3>
                    <div class="price">R$ 0,00</div>
                    <a href="#" class="btn-buy">Comprar</a>
                </div>
            </div>

            <div class="product-card">
                <img src="https://via.placeholder.com/150" alt="Novo Produto" class="product-image">
                <div class="product-info">
                    <h3>Novo Produto</h3>
                    <div class="price">R$ 0,00</div>
                    <a href="#" class="btn-buy">Comprar</a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Vitrine Profissional
    </footer>

</body>
</html>
