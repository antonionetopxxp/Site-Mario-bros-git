<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Online | Profissional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #a38d74; 
            --bg: #f8f9fa;
            --text: #333;
            --radius: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        header {
            background: #fff;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas no celular */
            gap: 12px;
        }

        @media (min-width: 768px) {
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .product-image {
            width: 100%;
            height: 140px; 
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .product-info h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            height: 35px;
            overflow: hidden;
        }

        .price {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* CSS que você enviou */
        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            margin-top: auto;
            font-size: 0.8rem;
        }

        .add-to-cart:hover {
            background: #2980b9;
        }

        footer { text-align: center; padding: 20px; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h2 style="color: var(--primary); font-size: 1.2rem;">Minha Vitrine Online</h2>
        </div>
    </header>

    <main class="container">
        <div class="shop-grid">
            
            <div class="product-card">
                <img src="nutri.webp" alt="Guiar Nutri" class="product-image">
                <div class="product-info">
                    <h3>Guiar Nutri</h3>
                    <div class="price">R$ 297,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>

            <div class="product-card">
                <img src="Canva.webp" alt="Curso Canva" class="product-image">
                <div class="product-info">
                    <h3>Business Canvas</h3>
                    <div class="price">R$ 27,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Vitrine Profissional
    </footer>

    <script>
        // Função para abrir link em nova aba
        function abrirLink(link) {
            if(link) {
                window.open(link, '_blank');
            }
        }

        // Event listeners para os botões conforme solicitado
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                const link = this.getAttribute('data-link');
                abrirLink(link);
            });
        });
    </script>

</body>
</html>
