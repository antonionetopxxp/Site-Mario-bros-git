<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #4834d4;
            --bg: #f3f0ff;
            --text: #2d3436;
            --radius: 12px;
            --shadow: 0 5px 20px rgba(108,92,231,0.12);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; }
        body { background:var(--bg); color:var(--text); }
        .container { max-width:1000px; margin:0 auto; padding:0 15px; }

        header { width:100%; background:#1a0533; line-height:0; margin-bottom:28px; }
        header img.banner { width:100%; height:auto; max-height:160px; object-fit:cover; object-position:center; display:block; }

        .shop-grid {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
            padding-bottom:30px;
        }
        @media(min-width:600px){
            .shop-grid { grid-template-columns:repeat(3,1fr); gap:24px; }
        }

        .product-card {
            background:#fff;
            border-radius:var(--radius);
            overflow:hidden;
            display:flex;
            flex-direction:column;
            border:1px solid #e0d9ff;
            box-shadow:var(--shadow);
            transition:var(--transition);
            height:100%;
        }
        .product-card:hover { transform:translateY(-6px); box-shadow:0 16px 32px rgba(108,92,231,0.22); }

        .product-image-container {
            width:100%;
            aspect-ratio:1/1;
            background:#faf9ff;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            border-bottom:1px solid #f0edff;
            flex-shrink:0;
        }
        @keyframes wiggle {
            0%   { transform: scale(1.04) rotate(0deg); }
            15%  { transform: scale(1.06) rotate(-2deg); }
            30%  { transform: scale(1.06) rotate(2deg); }
            45%  { transform: scale(1.06) rotate(-2deg); }
            60%  { transform: scale(1.06) rotate(2deg); }
            75%  { transform: scale(1.06) rotate(-1deg); }
            90%  { transform: scale(1.05) rotate(1deg); }
            100% { transform: scale(1.04) rotate(0deg); }
        }
        .product-image {
            width:100%; height:100%;
            object-fit:cover;
            display:block;
            transition:transform 0.3s ease;
        }
        .product-card:hover .product-image {
            animation: wiggle 0.6s ease forwards;
        }

        .product-info {
            padding:14px 12px;
            flex-grow:1;
            display:flex;
            flex-direction:column;
            text-align:center;
            gap:8px;
        }
        .product-info h3 {
            font-size:0.92rem;
            font-weight:700;
            color:var(--text);
            line-height:1.35;
            min-height:2.5em;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            overflow:hidden;
        }
        .price { font-weight:800; font-size:1.15rem; color:var(--primary); }

        .add-to-cart {
            margin-top:auto;
            width:100%;
            padding:11px 8px;
            background:var(--primary);
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition:var(--transition);
            font-weight:700;
            font-size:0.82rem;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:7px;
            box-shadow:0 4px 12px rgba(108,92,231,0.35);
        }
        .add-to-cart:hover { background:var(--primary-dark); transform:translateY(-2px); box-shadow:0 8px 20px rgba(108,92,231,0.5); }
        .add-to-cart:active { transform:translateY(1px); }

        footer { text-align:center; padding:22px; color:#7f8c8d; font-size:0.78rem; border-top:1px solid #e0d9ff; margin-top:10px; }

        .whatsapp-float {
            position:fixed; width:52px; height:52px;
            bottom:22px; right:22px;
            background:#25d366; color:#fff;
            border-radius:50%; font-size:26px;
            box-shadow:2px 4px 14px rgba(0,0,0,0.25);
            z-index:1000; display:flex;
            align-items:center; justify-content:center;
            text-decoration:none;
            transition:transform 0.3s ease;
        }
        .whatsapp-float:hover { transform:scale(1.12); color:white; }
    </style>
</head>
