<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Online | Purple Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Estilo Geral do Card do Produto */
    .product-row {
        background: #ffffff;
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        border: 1px solid #eee;
        transition: transform 0.2s ease;
    }

    .product-row:hover {
        transform: translateY(-3px);
        border-color: #a38d74;
    }

    /* Imagem do Produto */
    .product-image {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        object-fit: cover;
        margin-right: 15px;
    }

    /* Textos e Informações */
    .product-info-group {
        display: flex;
        align-items: center;
        flex-grow: 1;
    }

    .product-details h4 {
        margin: 0;
        color: #333;
        font-size: 16px;
    }

    .product-details span {
        font-size: 12px;
        color: #888;
        display: block;
    }

    /* Valores e Comissões */
    .product-pricing {
        text-align: right;
        margin: 0 30px;
    }

    .price-label {
        font-size: 11px;
        color: #999;
        text-transform: uppercase;
        display: block;
    }

    .price-value {
        font-weight: bold;
        color: #27ae60; /* Verde para destacar seu lucro */
        font-size: 18px;
    }

    /* Botão de Link */
    .btn-action-link {
        background-color: #a38d74;
        color: white !important;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: bold;
        font-size: 14px;
        transition: background 0.3s;
    }

    .btn-action-link:hover {
        background-color: #8a765f;
    }

    /* Responsividade para Celular */
    @media (max-width: 600px) {
        .product-row { flex-direction: column; text-align: center; }
        .product-info-group { flex-direction: column; margin-bottom: 15px; }
        .product-image { margin: 0 0 10px 0; }
        .product-pricing { margin: 10px 0; text-align: center; }
    }
</style>
    
    <style>
        :root {
            /* NOVA PALETA ROXA */
            --primary: #6c5ce7;      /* Roxo vibrante principal */
            --primary-dark: #4834d4; /* Roxo mais escuro para hover */
            --header-bg: #2d3436;    /* Cinza quase preto para o topo */
            --bg: #f3f0ff;           /* Fundo levemente arroxeado */
            --text: #2d3436;
            --radius: 10px;
            --card-shadow: 0 5px 15px rgba(108, 92, 231, 0.1);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        header {
            background: var(--header-bg);
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 768px) {
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #e0d9ff;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(108, 92, 231, 0.2);
        }

        .product-image-container {
            width: 100%;
            height: 140px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f0edff;
        }

        .product-image {
            max-width: 90%;
            max-height: 90%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .product-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .product-info h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            height: 35px;
            overflow: hidden;
            color: var(--text);
        }

        .price {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--primary); /* Preço em roxo */
        }

        /* BOTÃO ROXO FLUTUANTE */
        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-weight: 600;
            margin-top: auto;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
        }

        .add-to-cart:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(108, 92, 231, 0.5);
        }

        .add-to-cart:active {
            transform: translateY(1px);
        }

        footer { text-align: center; padding: 25px; color: #7f8c8d; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h2 style="color: #fff; font-size: 1.3rem; font-weight: 600; letter-spacing: 1px;">
                <i class="fas fa-bolt" style="color: var(--primary);"></i> VITRINE ONLINE
            </h2>
        </div>
    </header>

    <main class="container">
        <div class="shop-grid">
            
            <div class="product-card">
                <div class="product-image-container">
                    <img src="nutri.webp" alt="Guiar Nutri" class="product-image">
                </div>
                <div class="product-info">
                    <h3>Guiar Nutri</h3>
                    <div class="price">R$ 297,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>


<div class="product-row">
    <div class="product-info-group">
        <a href="SEU_LINK_AQUI" target="_blank" class="btn-action-link">Pegar Link</a>
</div>
 <div class="product-card">
                <div class="product-image-container">
                    <img src="Canva.webp" alt="Curso Canva" class="product-image">
                </div>
                <div class="product-info">
                    <h3>Business Canvas</h3>
                    <div class="price">R$ 27,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Vitrine Profissional | Todos os direitos reservados.
    </footer>

    <script>
        function abrirLink(link) {
            if(link) {
                window.open(link, '_blank');
            }
        }

        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                const link = this.getAttribute('data-link');
                abrirLink(link);
            });
        });
    </script>
<a href="https://wa.me/5561994568770" class="whatsapp-float" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>

<style>
.whatsapp-float {
    position: fixed;
    width: 50px;
    height: 50px;
    bottom: 20px;
    right: 20px;
    background-color: #25d366;
    color: #FFF;
    border-radius: 50px;
    text-align: center;
    font-size: 25px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.3s ease;
}
.whatsapp-float:hover {
    transform: scale(1.1);
    color: white;
}
</style>
</body>
</html>
