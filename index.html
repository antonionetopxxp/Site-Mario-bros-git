<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Online | Fotos Inteiras e Flutuantes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #a38d74; 
            --bg: #f8f9fa;
            --text: #333;
            --radius: 10px;
            /* Sombra suave e profissional para o cartão */
            --card-shadow: 0 5px 15px rgba(0,0,0,0.08);
            /* Transição padrão para efeitos suaves */
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        .container { max-width: 1000px; margin: 0 auto; padding: 15px; }

        header {
            background: #fff;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas no celular */
            gap: 12px;
        }

        @media (min-width: 768px) {
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        }

        .product-card {
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #f0f0f0;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth); /* Suavidade no hover do cartão */
        }

        /* O cartão também se levanta levemente */
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        /* Contêiner da imagem para controle de tamanho e fundo */
        .product-image-container {
            width: 100%;
            height: 140px; /* Altura controlada */
            background-color: #fff; /* Fundo branco para imagens menores */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid #f0f0f0; /* Borda inferior fina */
        }

        /* IMAGEM DO PRODUTO INTEIRA E SEM CORTES */
        .product-image {
            max-width: 95%; /* Pequena margem interna */
            max-height: 95%; /* Pequena margem interna */
            width: auto;
            height: auto;
            object-fit: contain; /* ESSENCIAL: Garante a imagem inteira mantendo a proporção */
            display: block;
        }

        .product-info {
            padding: 10px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .product-info h3 {
            font-size: 0.9rem;
            margin-bottom: 5px;
            height: 35px;
            overflow: hidden;
            color: var(--primary); /* Título na cor elegante */
        }

        .price {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text);
        }

        /* CSS do botão baseado no seu anterior, com o efeito FLUTUANTE */
        .add-to-cart {
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-smooth); /* Transição suave e profissional */
            font-weight: 600;
            margin-top: auto;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            /* Sombra inicial leve no botão */
            box-shadow: 0 2px 6px rgba(52, 152, 219, 0.3);
        }

        /* O EFEITO FLUTUANTE AQUI */
        .add-to-cart:hover {
            background: #2980b9;
            transform: translateY(-3px); /* Levanta o botão 3px */
            /* Sombra do botão aumenta ao flutuar, simulando distância */
            box-shadow: 0 6px 15px rgba(52, 152, 219, 0.5);
        }

        /* Efeito de clique no botão (active) */
        .add-to-cart:active {
            transform: translateY(1px); /* Baixa um pouco ao clicar */
            box-shadow: 0 2px 4px rgba(52, 152, 219, 0.4);
        }

        footer { text-align: center; padding: 20px; color: #999; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h2 style="color: var(--primary); font-size: 1.2rem; font-weight: 600;">Minha Vitrine Profissional</h2>
        </div>
    </header>

    <main class="container">
        <div class="shop-grid">
            
            <div class="product-card">
                <div class="product-image-container">
                    <img src="nutri.webp" alt="Guiar Nutri" class="product-image">
                </div>
                <div class="product-info">
                    <h3>Guiar Nutri</h3>
                    <div class="price">R$ 297,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>

            <div class="product-card">
                <div class="product-image-container">
                    <img src="Canva.webp" alt="Curso Canva" class="product-image">
                </div>
                <div class="product-info">
                    <h3>Business Canvas</h3>
                    <div class="price">R$ 27,00</div>
                    <button class="add-to-cart" data-link="https://shop.maisfy.com.br/checkout/Dcgnm2h7/Udzu53c6/Ucqkhnj5">
                        <i class="fas fa-shopping-cart"></i> Comprar Agora
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        &copy; 2026 Vitrine Profissional | Todos os direitos reservados.
    </footer>

    <script>
        // Função para abrir link em nova aba (sua lógica original)
        function abrirLink(link) {
            if(link) {
                window.open(link, '_blank');
            }
        }

        // Event listeners para os botões conforme solicitado
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                const link = this.getAttribute('data-link');
                abrirLink(link);
            });
        });
    </script>

</body>
</html>
